<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>

  </style>
</head>
<body>
  <div class="box">Box 1</div>
  <div class="box">Box 2</div>
  <div class="circle">Circle</div>
  <script>
    let elements = document.getElementsByClassName('box');
    // console.log(elements);
    // getElementsByClassName returns elements so you have to loop over it to access.
    for(let i=0;i<elements.length;i++){
      elements.item(i).style.background = "blue";
    }
    let els = document.getElementsByClassName('circle');
    // console.log(els.item(0));
    els.item(0).style.background = "red";
    // before applying style to an element first console it.
  </script>
</body>
</html>
